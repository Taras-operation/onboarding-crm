{% extends 'base.html' %}
{% block title %}Вхід — Onboarding CRM{% endblock %}
{% block shell %}
<div class="centered-wrap">
  <div class="centered-card">
    <div class="text-center mb-4">
      <div style="font-size:1.4rem;font-weight:700;">Onboarding CRM</div>
      <div class="text-muted">Вхід до системи</div>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Логін</label>
        <input type="text" name="login" class="form-control" placeholder="Логін" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" placeholder="Пароль" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Увійти</button>
    </form>
  </div>
</div>
{% endblock %}
