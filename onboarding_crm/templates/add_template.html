<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Редактор шаблону онбордингу</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />

  <style>
    .drag-handle {
      user-select: none;
      cursor: move;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .sortable-ghost { opacity: .4; }
    .sortable-chosen { background: #f8fafc; }
  </style>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-5xl mx-auto bg-white p-6 rounded shadow">
  <h1 class="text-2xl font-bold mb-4">Редактор онбордингу</h1>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input
      type="text"
      name="name"
      value="{{ name or '' }}"
      placeholder="Назва шаблону"
      class="w-full border rounded p-2 mb-4"
      required
    />

    <label class="block mb-1 font-medium">Куди зберегти</label>

    <select name="selected_manager" class="w-full border rounded p-2 mb-4">
      <option value="template" {% if selected_manager == 'template' or not selected_manager %}selected{% endif %}>
        Зберегти як шаблон
      </option>

      {% if managers and managers|length > 0 %}
        {% for manager in managers %}
          <option value="{{ manager.id }}" {% if selected_manager|string == manager.id|string %}selected{% endif %}>
            {{ manager.full_name or manager.username or manager.login }}
          </option>
        {% endfor %}
      {% else %}
        <option value="" disabled>(Немає менеджерів у відділі)</option>
      {% endif %}
    </select>

    <div id="blocks-container" class="space-y-4"></div>

    <button
      type="button"
      onclick="addStage(); if (typeof autosaveTemplate==='function'){ try{ autosaveTemplate(); }catch(e){} }"
      class="bg-blue-500 text-white px-4 py-2 rounded mt-4"
    >
      + Додати етап
    </button>

    <input type="hidden" name="structure" id="structure" />

    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded mt-4">
      Зберегти
    </button>
  </form>
</div>

<script>
  window.templateData     = {{ structure | tojson | safe }};
  window.onboarding_step  = {{ onboarding_step | default(0) }};
  window.templateId       = {{ template.id if template and template.id else 'null' }};
</script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="{{ url_for('static', filename='js/editor_blocks.js') }}"></script>

<script>
  const AUTOSAVE_KEY = `onboarding_template_draft_${window.templateId || 'new'}`;
  let isSubmitting = false;

  function getDraftPayload() {
    const form = document.querySelector('form');
    const blocksContainer = document.getElementById('blocks-container');

    return {
      savedAt: new Date().toISOString(),
      name: form?.querySelector('[name="name"]')?.value || '',
      selected_manager: form?.querySelector('[name="selected_manager"]')?.value || '',
      blocks_html: blocksContainer?.innerHTML || ''
    };
  }

  function autosaveTemplate() {
    if (isSubmitting) return;

    const blocksContainer = document.getElementById('blocks-container');
    if (!blocksContainer) return;

    const payload = getDraftPayload();

    if (!payload.name && !payload.blocks_html.trim()) return;

    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
    showAutosaveStatus('Чернетку збережено автоматично');
  }

  function showAutosaveStatus(text) {
    let el = document.getElementById('autosave-status');

    if (!el) {
      el = document.createElement('div');
      el.id = 'autosave-status';
      el.className = 'text-sm text-gray-500 mt-3';
      document.querySelector('form')?.appendChild(el);
    }

    el.textContent = text;
  }

  function restoreDraftIfNeeded() {
    const wasSubmitted = sessionStorage.getItem(`${AUTOSAVE_KEY}_submitted`);

    if (wasSubmitted === '1') {
      localStorage.removeItem(AUTOSAVE_KEY);
      sessionStorage.removeItem(`${AUTOSAVE_KEY}_submitted`);
      return;
    }

    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return;

    let draft = null;

    try {
      draft = JSON.parse(raw);
    } catch (e) {
      return;
    }

    if (!draft || !draft.blocks_html) return;

    const savedDate = draft.savedAt
      ? new Date(draft.savedAt).toLocaleString()
      : 'невідомо';

    const shouldRestore = confirm(
      `Знайдено незбережену чернетку від ${savedDate}. Відновити її?`
    );

    if (!shouldRestore) return;

    const form = document.querySelector('form');
    const blocksContainer = document.getElementById('blocks-container');

    if (form?.querySelector('[name="name"]')) {
      form.querySelector('[name="name"]').value = draft.name || '';
    }

    if (form?.querySelector('[name="selected_manager"]')) {
      form.querySelector('[name="selected_manager"]').value = draft.selected_manager || 'template';
    }

    if (blocksContainer) {
      blocksContainer.innerHTML = draft.blocks_html;
    }

    showAutosaveStatus('Чернетку відновлено');
  }

  window.addEventListener('load', () => {
    setTimeout(restoreDraftIfNeeded, 800);
  });

  document.addEventListener('input', () => {
    clearTimeout(window.__autosaveTimer);
    window.__autosaveTimer = setTimeout(autosaveTemplate, 800);
  });

  document.addEventListener('change', () => {
    clearTimeout(window.__autosaveTimer);
    window.__autosaveTimer = setTimeout(autosaveTemplate, 800);
  });

  setInterval(autosaveTemplate, 5000);

  window.addEventListener('beforeunload', function () {
    if (isSubmitting) return;
    autosaveTemplate();
  });

  document.querySelector('form')?.addEventListener('submit', function () {
    isSubmitting = true;

    // Якщо користувач свідомо натиснув "Зберегти",
    // при наступному відкритті сторінки стару чернетку треба прибрати.
    sessionStorage.setItem(`${AUTOSAVE_KEY}_submitted`, '1');
  });
</script>

</body>
</html>
