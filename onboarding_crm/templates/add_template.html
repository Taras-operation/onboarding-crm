<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Редактор шаблону онбордингу</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />

  <style>
    .drag-handle {
      user-select: none;
      cursor: move;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .sortable-ghost { opacity: .4; }
    .sortable-chosen { background: #f8fafc; }
    .rich-editor-wrapper { margin-bottom: 0.5rem; }
    .rich-editor { background: #fff; }
    .rich-editor .ql-editor {
      min-height: 110px;
      font-size: 14px;
      line-height: 1.5;
    }
    .ql-toolbar.ql-snow {
      border-radius: 0.375rem 0.375rem 0 0;
      background: #f9fafb;
    }
    .ql-container.ql-snow {
      border-radius: 0 0 0.375rem 0.375rem;
    }
    .editor-shell {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 1.25rem;
      max-width: 1280px;
      margin: 0 auto;
    }
    .editor-sidebar {
      position: sticky;
      top: 1.5rem;
      align-self: start;
      max-height: calc(100vh - 3rem);
      overflow: hidden;
    }
    .editor-sidebar-list {
      max-height: calc(100vh - 250px);
      overflow-y: auto;
    }
    .editor-nav-item.active {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1d4ed8;
    }
    @media (max-width: 1024px) {
      .editor-shell {
        display: block;
      }
      .editor-sidebar {
        position: static;
        max-height: none;
        margin-bottom: 1rem;
      }
      .editor-sidebar-list {
        max-height: 260px;
      }
    }
  </style>
</head>

<body class="bg-gray-100 p-6">

<div class="editor-shell">
  <aside class="editor-sidebar bg-white p-4 rounded shadow border">
    <div class="mb-4">
      <div class="text-sm text-gray-500">Навігація</div>
      <h2 class="text-lg font-bold">Блоки шаблону</h2>
    </div>

    <div class="grid gap-2 mb-4">
      <button type="button" id="sidebarSaveBtn" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded text-sm font-medium">
        💾 Зберегти
      </button>
      <button type="button" id="sidebarReorderBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-2 rounded text-sm font-medium">
        🔀 Змінити порядок
      </button>
      <button type="button" id="sidebarAddBlockBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm font-medium">
        + Додати етап
      </button>
    </div>

    <div class="text-xs text-gray-500 mb-2">Швидкий перехід</div>
    <div id="blockNavigatorList" class="editor-sidebar-list space-y-2"></div>
  </aside>

  <div class="bg-white p-6 rounded shadow min-w-0">
  <h1 class="text-2xl font-bold mb-4">Редактор онбордингу</h1>

  <form method="POST" id="onboardingEditorForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <input
      type="text"
      name="name"
      value="{{ name or '' }}"
      placeholder="Назва шаблону"
      class="w-full border rounded p-2 mb-4"
      required
    />

    <label class="block mb-1 font-medium">Куди зберегти</label>

    <select name="selected_manager" class="w-full border rounded p-2 mb-4">
      <option value="template" {% if selected_manager == 'template' or not selected_manager %}selected{% endif %}>
        Зберегти як шаблон
      </option>

      {% if managers and managers|length > 0 %}
        {% for manager in managers %}
          <option value="{{ manager.id }}" {% if selected_manager|string == manager.id|string %}selected{% endif %}>
            {{ manager.full_name or manager.username or manager.login }}
          </option>
        {% endfor %}
      {% else %}
        <option value="" disabled>(Немає менеджерів у відділі)</option>
      {% endif %}
    </select>

    <div id="blocks-container" class="space-y-4"></div>

    <button
      type="button"
      onclick="addStage(); if (typeof autosaveTemplate==='function'){ try{ autosaveTemplate(); }catch(e){} }"
      class="bg-blue-500 text-white px-4 py-2 rounded mt-4"
    >
      + Додати етап
    </button>

    <input type="hidden" name="structure" id="structure" />

    <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded mt-4">
      Зберегти
    </button>
  </form>
  </div>
</div>

<script>
  window.templateData     = {{ structure | tojson | safe }};
  window.onboarding_step  = {{ onboarding_step | default(0) }};
  window.templateId       = {{ template.id if template and template.id else 'null' }};
</script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script src="{{ url_for('static', filename='js/editor_blocks.js') }}"></script>

<script>
  const AUTOSAVE_KEY = `onboarding_template_draft_${window.templateId || 'new'}`;
  let isSubmitting = false;

  function getEditorBlocks() {
    return Array.from(document.querySelectorAll('#blocks-container > .block'));
  }

  function getBlockTitle(block, index) {
    const titleInput = block.querySelector('[name^="blocks"][name$="[title]"]');
    const value = titleInput?.value?.trim();
    return value || `Блок №${index + 1}`;
  }

  function buildBlockNavigator() {
    const list = document.getElementById('blockNavigatorList');
    if (!list) return;

    const blocks = getEditorBlocks();

    if (!blocks.length) {
      list.innerHTML = '<div class="text-sm text-gray-500 bg-gray-50 border rounded p-3">Поки що немає блоків</div>';
      return;
    }

    list.innerHTML = blocks.map((block, index) => {
      if (!block.id) block.id = `editor-block-${index + 1}`;

      const title = getBlockTitle(block, index)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

      const subCount = block.querySelectorAll('.subblock').length;
      const testCount = block.querySelectorAll('.test').length;
      const openCount = block.querySelectorAll('.open-question').length;

      return `
        <button type="button"
                class="editor-nav-item w-full text-left border rounded p-2 bg-gray-50 hover:bg-blue-50 transition"
                data-target="${block.id}">
          <div class="flex gap-2 items-start">
            <span class="shrink-0 w-7 h-7 rounded bg-blue-100 text-blue-700 flex items-center justify-center text-sm font-bold">${index + 1}</span>
            <span class="min-w-0 flex-1">
              <span class="block text-sm font-semibold truncate">${title}</span>
              <span class="block text-xs text-gray-500 mt-1">Саб: ${subCount} · Тести: ${testCount} · Відкр: ${openCount}</span>
            </span>
          </div>
        </button>
      `;
    }).join('');
  }

  function scrollToEditorBlock(blockId) {
    const block = document.getElementById(blockId);
    if (!block) return;

    block.scrollIntoView({ behavior: 'smooth', block: 'start' });
    block.classList.add('ring-2', 'ring-blue-400');

    setTimeout(() => {
      block.classList.remove('ring-2', 'ring-blue-400');
    }, 1200);
  }

  function highlightActiveNavigatorItem() {
    const items = Array.from(document.querySelectorAll('.editor-nav-item'));
    const blocks = getEditorBlocks();
    if (!items.length || !blocks.length) return;

    let activeId = blocks[0].id;
    const offset = 140;

    blocks.forEach(block => {
      const rect = block.getBoundingClientRect();
      if (rect.top <= offset) {
        activeId = block.id;
      }
    });

    items.forEach(item => {
      item.classList.toggle('active', item.dataset.target === activeId);
    });
  }

  function initEditorSidebar() {
    buildBlockNavigator();

    document.getElementById('blockNavigatorList')?.addEventListener('click', event => {
      const item = event.target.closest('.editor-nav-item');
      if (!item) return;
      scrollToEditorBlock(item.dataset.target);
    });

    document.getElementById('sidebarSaveBtn')?.addEventListener('click', () => {
      document.getElementById('onboardingEditorForm')?.requestSubmit();
    });

    document.getElementById('sidebarReorderBtn')?.addEventListener('click', () => {
      if (typeof openReorderModal === 'function') openReorderModal();
    });

    document.getElementById('sidebarAddBlockBtn')?.addEventListener('click', () => {
      if (typeof addStage === 'function') {
        addStage();
        buildBlockNavigator();
        if (typeof autosaveTemplate === 'function') {
          try { autosaveTemplate(); } catch (_) {}
        }
      }
    });

    document.addEventListener('input', event => {
      if (event.target.matches('[name^="blocks"][name$="[title]"]')) {
        clearTimeout(window.__blockNavigatorTimer);
        window.__blockNavigatorTimer = setTimeout(buildBlockNavigator, 300);
      }
    });

    const blocksContainer = document.getElementById('blocks-container');
    if (blocksContainer) {
      const observer = new MutationObserver(() => {
        clearTimeout(window.__blockNavigatorTimer);
        window.__blockNavigatorTimer = setTimeout(buildBlockNavigator, 150);
      });
      observer.observe(blocksContainer, { childList: true, subtree: true });
    }

    window.addEventListener('scroll', highlightActiveNavigatorItem, { passive: true });
    setInterval(buildBlockNavigator, 3000);
  }

  function getDraftPayload() {
    const form = document.querySelector('form');
    const blocksContainer = document.getElementById('blocks-container');

    let blocksHtml = '';

    if (blocksContainer) {
      const clone = blocksContainer.cloneNode(true);

      clone.querySelectorAll('input, textarea, select').forEach(el => {
        if (el.tagName === 'TEXTAREA') {
          el.textContent = el.value;
        } else if (el.tagName === 'SELECT') {
          Array.from(el.options).forEach(option => {
            if (option.value === el.value) {
              option.setAttribute('selected', 'selected');
            } else {
              option.removeAttribute('selected');
            }
          });
        } else if (el.type === 'checkbox' || el.type === 'radio') {
          if (el.checked) {
            el.setAttribute('checked', 'checked');
          } else {
            el.removeAttribute('checked');
          }
        } else {
          el.setAttribute('value', el.value);
        }
      });

      blocksHtml = clone.innerHTML;
    }

    return {
      savedAt: new Date().toISOString(),
      name: form?.querySelector('[name="name"]')?.value || '',
      selected_manager: form?.querySelector('[name="selected_manager"]')?.value || '',
      blocks_html: blocksHtml
    };
  }

  function autosaveTemplate() {
    if (isSubmitting) return;

    const blocksContainer = document.getElementById('blocks-container');
    if (!blocksContainer) return;

    const payload = getDraftPayload();

    if (!payload.name && !payload.blocks_html.trim()) return;

    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
    showAutosaveStatus('Чернетку збережено автоматично');
  }

  function showAutosaveStatus(text) {
    let el = document.getElementById('autosave-status');

    if (!el) {
      el = document.createElement('div');
      el.id = 'autosave-status';
      el.className = 'text-sm text-gray-500 mt-3';
      document.querySelector('form')?.appendChild(el);
    }

    el.textContent = text;
  }

  function restoreDraftIfNeeded() {
    const wasSubmitted = sessionStorage.getItem(`${AUTOSAVE_KEY}_submitted`);

    if (wasSubmitted === '1') {
      localStorage.removeItem(AUTOSAVE_KEY);
      sessionStorage.removeItem(`${AUTOSAVE_KEY}_submitted`);
      return;
    }

    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return;

    let draft = null;

    try {
      draft = JSON.parse(raw);
    } catch (e) {
      return;
    }

    if (!draft || !draft.blocks_html) return;

    const savedDate = draft.savedAt
      ? new Date(draft.savedAt).toLocaleString()
      : 'невідомо';

    const shouldRestore = confirm(
      `Знайдено незбережену чернетку від ${savedDate}. Відновити її?`
    );

    if (!shouldRestore) return;

    const form = document.querySelector('form');
    const blocksContainer = document.getElementById('blocks-container');

    if (form?.querySelector('[name="name"]')) {
      form.querySelector('[name="name"]').value = draft.name || '';
    }

    if (form?.querySelector('[name="selected_manager"]')) {
      form.querySelector('[name="selected_manager"]').value = draft.selected_manager || 'template';
    }

    if (blocksContainer) {
      blocksContainer.innerHTML = draft.blocks_html;

      // Після відновлення чернетки потрібно заново
      // ініціалізувати всі Quill editor, інакше toolbar буде неактивний.
      setTimeout(() => {
        if (typeof reinitRichEditorsFromDOM === 'function') {
          reinitRichEditorsFromDOM();
        }
      }, 100);
    }

    showAutosaveStatus('Чернетку відновлено');
  }

  window.addEventListener('load', () => {
    setTimeout(() => {
      restoreDraftIfNeeded();
      initEditorSidebar();
    }, 800);
  });

  document.addEventListener('input', () => {
    clearTimeout(window.__autosaveTimer);
    window.__autosaveTimer = setTimeout(autosaveTemplate, 800);
  });

  document.addEventListener('change', () => {
    clearTimeout(window.__autosaveTimer);
    window.__autosaveTimer = setTimeout(autosaveTemplate, 800);
  });

  setInterval(autosaveTemplate, 5000);

  window.addEventListener('beforeunload', function () {
    if (isSubmitting) return;
    autosaveTemplate();
  });

  document.querySelector('form')?.addEventListener('submit', function () {
    isSubmitting = true;

    // Якщо користувач свідомо натиснув "Зберегти",
    // при наступному відкритті сторінки стару чернетку треба прибрати.
    sessionStorage.setItem(`${AUTOSAVE_KEY}_submitted`, '1');
  });
</script>

</body>
</html>
