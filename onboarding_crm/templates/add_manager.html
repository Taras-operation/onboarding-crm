{% extends 'base.html' %}
{% block title %}Додати менеджера — Onboarding CRM{% endblock %}
{% block content %}
<div class="page-title">➕ Додати менеджера</div>
<div class="page-subtitle">Створення облікового запису менеджера та привʼязка до ментора.</div>

<div class="form-card">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
      <label class="form-label" for="tg_nick">Telegram нік</label>
      <input type="text" id="tg_nick" name="tg_nick" class="form-control" placeholder="@nickname" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="position">Посада</label>
      <input type="text" id="position" name="position" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="department">Відділ</label>
      <input type="text" id="department" name="department" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="mentor_id">Ментор</label>
      <select name="mentor_id" id="mentor_id" class="form-select" required>
        <option value="">ПОТОЧНИЙ користувач (авто)</option>
        {% for mentor in mentors %}
          <option value="{{ mentor.id }}" {% if mentor.id == current_user.id %}selected{% endif %}>
            {{ mentor.username }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label" for="username">Логін</label>
      <input type="text" id="username" name="username" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Пароль</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Додати менеджера</button>
  </form>
</div>
{% endblock %}
