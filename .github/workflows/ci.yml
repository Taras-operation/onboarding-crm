name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests + coverage
        env:
          SECRET_KEY: ci-test-secret
        # Threshold starts low (legacy routes.py is largely untested) — raise it as
        # coverage grows. It is a floor, not a target.
        run: pytest --cov=onboarding_crm --cov-fail-under=30
